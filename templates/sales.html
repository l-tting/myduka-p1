
{% extends 'base.html' %}
{% block title %} Sales Page {% endblock %}
{% block content %}
<div>

   <p>My sales page</p>


<div>
      <table id="example" class="display">
         <thead>
            <tr>
               <th>Sale ID</th>
               <th>Product Name</th>
               <th>Buying Price</th>
               <th>Selling Price</th>

            </tr>
         </thead>
         <tbody>
            {% for sales in sales_data %}
            <tr>
               <td>{{ sales[0] }}</td>
               <td>{{ product[1] }}</td>
               <td>{{ product[2] }}</td>
               <td>{{ product[3] }}</td>
            </tr>
            {% endfor %}
         </tbody>
      </table>
   </div>




</div>
{% endblock %}
